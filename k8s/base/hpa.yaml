apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: country-info-service
  labels:
    app.kubernetes.io/name: country-info-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: country-info-service
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      # Scale down slowly to avoid flapping on bursty traffic.
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
