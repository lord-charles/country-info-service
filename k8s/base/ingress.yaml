apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: country-info-service
  labels:
    app.kubernetes.io/name: country-info-service
  annotations:
    # Edge protection: per-client rate limit and bounded timeouts (worst-case upstream path is
    # 3 SOAP attempts x 4s read timeout + backoff, so 30s is ample).
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "3"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "5"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-body-size: 64k
spec:
  ingressClassName: nginx
  rules:
    - host: country-info.local
      http:
        paths:
          # Only the public API and its docs; actuator stays cluster-internal.
          - path: /api
            pathType: Prefix
            backend:
              service: { name: country-info-service, port: { name: http } }
          - path: /swagger-ui
            pathType: Prefix
            backend:
              service: { name: country-info-service, port: { name: http } }
          - path: /v3/api-docs
            pathType: Prefix
            backend:
              service: { name: country-info-service, port: { name: http } }
