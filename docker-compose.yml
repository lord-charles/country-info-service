# Local stack: MySQL + the service. `docker compose up --build`, then http://localhost:8080/swagger-ui.html
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: countryinfo
      MYSQL_USER: countryinfo
      MYSQL_PASSWORD: countryinfo
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ucountryinfo -pcountryinfo --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    image: country-info-service:1.0.0
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/countryinfo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: countryinfo
      DB_PASSWORD: countryinfo
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    ports:
      - "8080:8080"

volumes:
  mysql-data:
